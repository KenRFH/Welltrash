<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline - WellTrash</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(22, 163, 74, 0.15), 0 0 1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(22, 163, 74, 0.1);
        }
        .icon-wrapper {
            width: 88px;
            height: 88px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #16a34a;
        }
        .icon-wrapper svg {
            width: 44px;
            height: 44px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 12px;
            font-weight: 700;
            border-radius: 9999px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px -6px rgba(22, 163, 74, 0.4);
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(22, 163, 74, 0.5);
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .footer-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 24px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            Koneksi Terputus
        </div>
        <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728-12.728m12.728 12.728L3 3m2.636 2.636a5 5 0 017.072 0"></path>
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Aplikasi WellTrash membutuhkan koneksi internet untuk memperbarui data. Silakan periksa jaringan Wi-Fi atau data seluler Anda.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Coba Muat Ulang
        </button>
        <p class="footer-text">WellTrash &bull; Jasa Pengelolaan Sampah Jember</p>
    </div>
</body>
</html>
